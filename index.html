<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preface HR Assistant</title>
    
    <!-- @n8n/chat CSS Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@n8n/chat@1/dist/style.css" />

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Ensure the root n8n chat container spans the full viewport correctly */
        .n8n-chat {
            height: 100vh !important;
            max-height: 100vh !important;
            display: flex !important;
            flex-direction: column !important;
        }

        /* Custom Theme Overrides */
        :root {
            --chat--color-primary: #111827;
            --chat--color-primary-shade-50: #1f2937;
            --chat--color-secondary: #0052FF;
            --chat--header--background: #111827;
            --chat--header--color: #ffffff;
            --chat--message--bot--background: #f3f4f6;
            --chat--message--bot--color: #1f2937;
            --chat--message--user--background: #111827;
            --chat--message--user--color: #ffffff;
            --chat--input--background: #ffffff;
            --chat--input--text-color: #1f2937;
        }
    </style>
</head>
<body>

    <script type="module">
        import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat@1/dist/chat.bundle.es.js';

        createChat({
            webhookUrl: 'https://bckss1234.app.n8n.cloud/webhook/68424003-66f9-4d33-86ac-5a44752f4987/chat',
            
            webhookConfig: {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            },

            // Set mode to fullscreen and leave target default (binds to document body)
            mode: 'fullscreen',

            chatInputKey: 'chatInput',
            chatSessionKey: 'sessionId',
            loadPreviousSession: true,
            showWelcomeScreen: true,
            enableStreaming: false,
            allowFileUploads: false,

            metadata: {
                department: 'Employee Inquiries',
                platform: 'Preface HR Portal'
            },

            defaultLanguage: 'en',
            i18n: {
                en: {
                    title: 'Preface HR Assistant',
                    subtitle: 'Ask about company policies, benefits, leave requests, and more.',
                    inputPlaceholder: 'Ask a question about Preface HR policy...'
                }
            },

            initialMessages: [
                '👋 Hello! Welcome to the **Preface HR Support Portal**.',
                'I am your AI HR Assistant. How can I help you today?'
            ]
        });
    </script>

</body>
</html>
